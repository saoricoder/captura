<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Accesibilidad</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1a1a1a;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
      }

      .hint {
        margin: 0 0 16px;
        font-size: 12px;
        color: #666666;
      }

      .section {
        margin-bottom: 16px;
      }

      .label {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #666666;
      }

      .panel {
        padding: 10px 12px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        background: #fafafa;
        white-space: pre-wrap;
        word-wrap: break-word;
        min-height: 40px;
        max-height: 160px;
        overflow-y: auto;
      }

      .panel--result {
        background: #f0f0f0;
        border-color: #dcdcdc;
        color: #333333;
        min-height: 56px;
      }

      .panel--media {
        background: #f7f9fc;
        border-color: #d4dce8;
        min-height: 72px;
        max-height: 220px;
      }

      .status {
        margin: 0;
        font-size: 13px;
        color: #666666;
      }

      .status--error {
        color: #8a2b2b;
      }

      .status--hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Screen Accessibility Helper</h1>
    <p class="hint">Protocolo Cero-Rastro: clic central para cerrar, hover 2 s para texto, subtítulos en vivo al reproducir. Sin red externa.</p>

    <section class="section">
      <span class="label">Texto capturado</span>
      <div id="source-text" class="panel">Esperando captura…</div>
    </section>

    <section class="section">
      <span class="label">Traducción</span>
      <div id="result-text" class="panel panel--result"></div>
    </section>

    <section class="section">
      <span class="label">Transcripción multimedia</span>
      <div id="media-transcript" class="panel panel--media">Sin segmentos de audio activos.</div>
    </section>

    <section class="section">
      <span class="label">Traducción multimedia</span>
      <div id="media-translation" class="panel panel--result"></div>
    </section>

    <p id="status" class="status status--hidden"></p>

    <div
      id="browser-translate-bridge"
      lang="en"
      translate="yes"
      aria-hidden="true"
      style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;"
    ></div>

    <script src="local-dictionary.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
